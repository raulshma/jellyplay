# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g
# Kotlin compiler daemon heap. The default is too small for 36 modules compiled
# in parallel (KSP2 also shares this process), causing GC thrash on every build.
# 4g: the CI tv lane died with GC-overhead OOM at 3g during compileAndroidMain
# (release run 35425885803); 16 GB CI runners and the 15 GB dev box both fit
# 6g Gradle + 4g Kotlin.
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseParallelGC
# 18 cores but only 15GB RAM: cap concurrent worker processes (dexing, resource
# transforms, packaging) so the parallel build doesn't spill into the pagefile.
org.gradle.workers.max=12
android.nonTransitiveRClass=true
android.disallowKotlinSourceSets=false
android.enableJetifier=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Opt-in flag through Gradle 9.7.1: run configuration-cache entries in parallel.
org.gradle.configuration-cache.parallel=true
kotlin.incremental.usePreciseJavaTracking=true
kotlin.code.style=official
android.enableAppCompileTimeRClass=true

# Optimize KSP
ksp.useKSP2=true

# Enable Compose Compiler metrics/reports for perf baseline measurements
enableComposeMetrics=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# R8 determinism — REQUIRED for F-Droid reproducible builds (Binaries:).
# R8 9.5.x has a worklist-order nondeterminism (issuetracker.google.com
# 554586985, sibling 565508292): phi-type recomputation during lens code
# rewriting lands on different outlining decisions run-to-run, flipping
# classes.dex between two stable byte states (v0.11.12's buildserver
# compare failed on exactly this — one closeFinally outline, 44-byte dex
# delta). This flag forces threadCount=1 + IdentityIROrdering inside R8,
# removing the ordering variable on EVERY build (store included). It rides
# gradle.properties so the fdroid buildserver and fdroid-release.yml both
# pick it up with no lane-side sed. Cost: slower R8 on release builds.
systemProp.com.android.tools.r8.deterministicdebugging=true
