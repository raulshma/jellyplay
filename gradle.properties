# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g
# Kotlin compiler daemon heap. The default is too small for 36 modules compiled
# in parallel (KSP2 also shares this process), causing GC thrash on every build.
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC
# 18 cores but only 15GB RAM: cap concurrent worker processes (dexing, resource
# transforms, packaging) so the parallel build doesn't spill into the pagefile.
org.gradle.workers.max=12
android.nonTransitiveRClass=true
android.disallowKotlinSourceSets=false
android.enableJetifier=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.incremental.usePreciseJavaTracking=true
kotlin.code.style=official
android.enableR8.fullMode=true
android.enableAppCompileTimeRClass=true

# Optimize KSP
ksp.useKSP2=true

# Enable Compose Compiler metrics/reports for perf PR baseline
enableComposeMetrics=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
