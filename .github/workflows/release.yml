name: Release

# Stable cut = TWO GitHub releases from one push:
#  * the stable Android APK release (tag v<x.y.z>, /releases/latest), and
#  * a KMP pre-release (tag v<x.y.z>-alpha.N: desktop installers + web
#    bundle) from the same commit — the KMP lane mirrors the
#    release-alpha/** channel in kmp-release.yml, which stays available for
#    mid-cycle alpha cuts without an Android release.

on:
  push:
    branches:
      - 'v[0-9]+*'
      # Pre-release channels live in kmp-release.yml under release-alpha/* —
      # a namespace these globs can never match. The exclusions below guard
      # dashed channel names (v0.11.0-alpha, release/v1.0.0-rc typos) from
      # slipping through the positive globs and publishing Android APKs as
      # the latest STABLE release.
      - '!v[0-9]+*-*'
      - 'release/**'
      - '!release/v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# bash for every run: step: the desktop matrix below includes windows-latest,
# where the default run shell is pwsh (the installer rename is bash: shopt,
# find -print0, process substitution).
defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      apk_version: ${{ steps.version.outputs.apk_version }}
      alpha_tag: ${{ steps.version.outputs.alpha_tag }}
      alpha_display: ${{ steps.version.outputs.alpha_display }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate Release Version
        id: version
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          # POSIX ERE has no (?:...) — grep >=3.8 rejects the ? and matches
          # nothing. `|| true` keeps the no-version fallback below reachable
          # under pipefail (a no-match grep exits 1).
          BASE_VERSION=$(echo "$BRANCH_NAME" | grep -oE '(^|/)[v]?[0-9]+\.[0-9]+(\.[0-9]+)?' | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1 || true)
          if [ -z "$BASE_VERSION" ]; then BASE_VERSION="1.0.0"; fi

          IFS='.' read -r major minor patch <<< "$BASE_VERSION"
          minor=${minor:-0}
          patch=${patch:-0}

          BASE_PREFIX="v${major}.${minor}"

          # Stable bump reads STABLE tags only. Prerelease tags
          # (v0.11.0-alpha.1 — published by this lane's KMP job and by
          # kmp-release.yml) also match the v0.11.* glob, and their trailing
          # alpha ordinal would corrupt the patch math: with only
          # v0.11.0-alpha.1 existing, the next stable cut would land on
          # v0.11.2 instead of v0.11.0.
          # grep -v exits 1 when it selects zero lines — a fresh minor with
          # only -alpha tags (v0.11.0-alpha.1) would otherwise trip pipefail.
          latest_tag=$(git tag -l "${BASE_PREFIX}.*" | grep -v -e '-' | sort -V | tail -n 1 || true)

          if [ -n "$latest_tag" ]; then
              latest_patch=${latest_tag##*.}
              new_patch=$((latest_patch + 1))
              NEW_TAG="${BASE_PREFIX}.${new_patch}"
              NEW_APK_VERSION="${major}.${minor}.${new_patch}"
          else
              NEW_TAG="${BASE_PREFIX}.${patch}"
              NEW_APK_VERSION="${major}.${minor}.${patch}"
          fi

          # KMP alpha riding the stable cut: same numeric base as the new
          # stable tag, ordinal continues any mid-cycle alphas of that base
          # (the release-alpha/** lane in kmp-release.yml) — cutting v0.11.0
          # stable after v0.11.0-alpha.1/.2 ships v0.11.0-alpha.3.
          ALPHA_PREFIX="v${NEW_APK_VERSION}-alpha"
          latest_alpha=$(git tag -l "${ALPHA_PREFIX}.*" | sort -V | tail -n 1)
          if [ -n "$latest_alpha" ]; then
              alpha_ordinal=$(( ${latest_alpha##*.} + 1 ))
          else
              alpha_ordinal=1
          fi
          ALPHA_TAG="${ALPHA_PREFIX}.${alpha_ordinal}"

          echo "Next tag computing to: $NEW_TAG"
          echo "Next APK version: $NEW_APK_VERSION"
          echo "KMP alpha tag: $ALPHA_TAG"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "apk_version=$NEW_APK_VERSION" >> $GITHUB_OUTPUT
          echo "alpha_tag=$ALPHA_TAG" >> $GITHUB_OUTPUT
          echo "alpha_display=${ALPHA_TAG#v}" >> $GITHUB_OUTPUT

  build:
    needs: determine-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [phone, tv]
    env:
      # The universal APK is opt-in, and BOTH gradle invocations below
      # must pass the same property — the baseline-profile lane so its GMD
      # APK set stays identical to pre-gating, the assemble lane so the
      # published artifact set (the rename step's known_abis) stays
      # byte-identical. Defined once here so the two steps cannot drift.
      BUILD_UNIVERSAL: -PbuildUniversal=true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Keystore + gradlew + KVM — the shared GMD-runner prereqs
      # (.github/actions/setup-gmd-runner; the KVM guard stays unconditional
      # to catch runner regressions on both legs, TV included).
      - name: Setup GMD Runner
        uses: ./.github/actions/setup-gmd-runner
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}

      # Generates the ART baseline/startup profile on a headless Gradle Managed
      # Device and writes baseline-prof.txt + startup-prof.txt into the app's
      # <flavor>Release sources; the androidx.baselineprofile consumer plugin
      # merges them into the release APK automatically during assemble.
      # Phone only — AGP cannot run TV images on Gradle Managed Devices, so the
      # tv flavor ships without generated profiles.
      # -PbuildUniversal=true (job-level $BUILD_UNIVERSAL): this step
      # assembles and installs the
      # app's release APKs on the x86_64 ciPixel8 GMD — keep its APK set
      # identical to what it built before the universal-APK gating (the
      # universal APK is where the emulator's ABI coverage came from).
      - name: Generate Baseline Profile
        if: matrix.flavor == 'phone'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:generate${{ matrix.flavor == 'phone' && 'Phone' || 'Tv' }}ReleaseBaselineProfile -PversionName="${{ needs.determine-version.outputs.apk_version }}" -PversionCode="${{ github.run_number }}" $BUILD_UNIVERSAL

      # saveInSrc writes the generated profiles into
      # app/src/phoneRelease/generated/baselineProfiles (baseline-prof.txt /
      # startup-prof.txt). The generate step can silently produce nothing
      # (emulator flake, runner regressions) and the lane would still ship a
      # profile-less release APK — fail it here instead, before the assemble
      # step reuses an empty profile source set.
      - name: Verify Baseline Profile Artifacts
        if: matrix.flavor == 'phone'
        run: |
          profile_dir="app/src/phoneRelease/generated/baselineProfiles"
          # Require BOTH artifacts, not any-of: a partial write (e.g. only
          # startup-prof.txt survived an emulator flake) still assembles a
          # release without the merged baseline profile, which is just as
          # profile-less as an empty directory. -s, not -f: a zero-byte
          # artifact is just as profile-less as a missing one.
          missing=()
          for f in "$profile_dir/baseline-prof.txt" "$profile_dir/startup-prof.txt"; do
            [ -s "$f" ] || missing+=("$f")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing baseline profile artifacts: ${missing[*]}"
            ls -laR app/src/phoneRelease 2>/dev/null || true
            exit 1
          fi
          echo "Baseline profile artifacts present:"
          ls -la "$profile_dir"

      - name: Build Android App (Release - ${{ matrix.flavor }})
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # -PbuildUniversal=true (job-level $BUILD_UNIVERSAL): the
        # universal APK is opt-in since the
        # splits gating; this lane is its only consumer (the rename step's
        # known_abis list includes it), so pass the property and the published
        # artifact set stays byte-identical.
        run: ./gradlew assemble${{ matrix.flavor == 'phone' && 'Phone' || 'Tv' }}Release -PversionName="${{ needs.determine-version.outputs.apk_version }}" -PversionCode="${{ github.run_number }}" $BUILD_UNIVERSAL

      - name: Rename APK Outputs
        run: |
          VERSION="${{ needs.determine-version.outputs.apk_version }}"
          shopt -s nullglob
          apks=(app/build/outputs/apk/*/*/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "ERROR: No APK files found"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            filename=$(basename "$apk")
            rest="${filename#app-}"
            tmp="${rest%-release.apk}"
            known_abis="arm64-v8a armeabi-v7a x86_64 universal"
            matched=false
            for known in $known_abis; do
              if [[ "$tmp" == *"-$known" ]]; then
                flavor="${tmp%-$known}"
                abi="$known"
                if [ -n "$flavor" ]; then
                  new_filename="jellyplay-v${VERSION}-${flavor}-${abi}.apk"
                else
                  new_filename="jellyplay-v${VERSION}-${abi}.apk"
                fi
                matched=true
                break
              fi
            done
            if [ "$matched" = false ]; then
              echo "Unknown APK naming format: $filename"
              continue
            fi
            mv "$apk" "$new_filename"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}
          path: jellyplay-*.apk
          retention-days: 7

  # KMP lane riding the stable cut — same packaging steps as the
  # release-alpha/** lane (kmp-release.yml), kept as a verbatim mirror so
  # the two files diff cleanly. Publishes as a SEPARATE pre-release tagged
  # v<x.y.z>-alpha.N (kmp-alpha-release job below); the stable APK job's
  # make_latest:true stays the only writer of /releases/latest.
  desktop-package:
    needs: determine-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Package desktop installers for current OS
        # packageVersion (numeric, = the stable apk_version) feeds
        # jpackage/msi; the display version (v0.11.0-alpha.1) lands in the
        # About screen via desktop-build.properties
        # (WriteDesktopBuildInfoTask).
        # macos-latest runners carry only 7 GB RAM; the repo-default -Xmx6g
        # Gradle daemon + -Xmx3g Kotlin daemon oversubscribe it and the
        # compiler dies with GC-overhead OOM (release run 35425885803). Cap
        # both for this leg only — linux/windows runners have 16 GB and keep
        # the repo defaults.
        run: >
          ./gradlew :apps:desktop:packageDistributionForCurrentOS
          -PjellyplayVersion=${{ needs.determine-version.outputs.apk_version }}
          -PjellyplayVersionName=${{ needs.determine-version.outputs.alpha_display }}
          ${{ matrix.platform == 'macos' && '-Dorg.gradle.jvmargs="-Xmx3g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs="-Xmx2g -XX:+UseParallelGC"' || '' }}
          --stacktrace

      - name: Rename installers with alpha version
        run: |
          VERSION="${{ needs.determine-version.outputs.alpha_display }}"
          shopt -s nullglob
          found=()
          while IFS= read -r -d '' f; do
            ext="${f##*.}"
            dest="jellyplay-desktop-${{ matrix.platform }}-v${VERSION}.${ext}"
            mv "$f" "$dest"
            found+=("$dest")
          done < <(find apps/desktop/build/compose/binaries/main -type f \
            \( -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \) -print0)
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::No installers produced for ${{ matrix.platform }}"
            exit 1
          fi
          printf 'Packaged: %s\n' "${found[@]}"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-${{ matrix.platform }}
          path: jellyplay-desktop-*
          retention-days: 7
          if-no-files-found: error

  web-bundle:
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Build web wasm bundle (production)
        run: ./gradlew :apps:web:wasmJsBrowserDistribution --stacktrace

      # Write <name>.gz sidecars for every *.wasm/*.js/*.css inside the
      # distribution BEFORE the zip step below (it takes the whole directory
      # verbatim), so self-hosters can serve them with nginx `gzip_static on;`
      # / Caddy `file_server precompressed` instead of on-the-fly compression.
      # The task dependsOn the distribution, so this is a cheap re-entry: the
      # bundle itself is already up to date here.
      - name: Precompress web bundle (gzip sidecars)
        run: ./gradlew :apps:web:precompressWasmDist --stacktrace

      - name: Zip web bundle with alpha version
        run: |
          VERSION="${{ needs.determine-version.outputs.alpha_display }}"
          cd apps/web/build/dist/wasmJs/productionExecutable
          zip -r "$RUNNER_TEMP/jellyplay-web-v${VERSION}.zip" .

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: ${{ runner.temp }}/jellyplay-web-*.zip
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [determine-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true
          # This run also carries desktop/web artifacts — pull the APK set
          # only, not the installers.
          pattern: 'apk-*'

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ needs.determine-version.outputs.tag }}"
          name: "Release ${{ needs.determine-version.outputs.tag }}"
          files: apks/jellyplay-*.apk
          generate_release_notes: true
          make_latest: true

  kmp-alpha-release:
    needs: [determine-version, desktop-package, web-bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Download KMP artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          pattern: 'desktop-installers-*'

      - name: Download web bundle artifact
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          pattern: 'web-bundle'

      # The alpha contract (same as kmp-release.yml): marked pre-release and
      # never "latest" — the Android updater's /releases/latest probe stays
      # on the stable line published by the release job above.
      - name: Publish KMP Alpha to GitHub Releases (pre-release)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ needs.determine-version.outputs.alpha_tag }}"
          name: "JellyPlay KMP Alpha ${{ needs.determine-version.outputs.alpha_tag }}"
          files: |
            release-assets/jellyplay-desktop-*
            release-assets/jellyplay-web-*
          generate_release_notes: true
          prerelease: true
          make_latest: false
