name: Release

on:
  push:
    branches:
      - 'v[0-9]+*'
      # Pre-release channels live in kmp-release.yml under release-alpha/* —
      # a namespace these globs can never match. The exclusions below guard
      # dashed channel names (v0.11.0-alpha, release/v1.0.0-rc typos) from
      # slipping through the positive globs and publishing Android APKs as
      # the latest STABLE release.
      - '!v[0-9]+*-*'
      - 'release/**'
      - '!release/v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      apk_version: ${{ steps.version.outputs.apk_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate Release Version
        id: version
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          BASE_VERSION=$(echo "$BRANCH_NAME" | grep -oE '(?:^|/)[v]?([0-9]+\.[0-9]+(\.[0-9]+)?)' | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1)
          if [ -z "$BASE_VERSION" ]; then BASE_VERSION="1.0.0"; fi

          IFS='.' read -r major minor patch <<< "$BASE_VERSION"
          minor=${minor:-0}
          patch=${patch:-0}

          BASE_PREFIX="v${major}.${minor}"

          latest_tag=$(git tag -l "${BASE_PREFIX}.*" | sort -V | tail -n 1)

          if [ -n "$latest_tag" ]; then
              latest_patch=${latest_tag##*.}
              new_patch=$((latest_patch + 1))
              NEW_TAG="${BASE_PREFIX}.${new_patch}"
              NEW_APK_VERSION="${major}.${minor}.${new_patch}"
          else
              NEW_TAG="${BASE_PREFIX}.${patch}"
              NEW_APK_VERSION="${major}.${minor}.${patch}"
          fi

          echo "Next tag computing to: $NEW_TAG"
          echo "Next APK version: $NEW_APK_VERSION"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "apk_version=$NEW_APK_VERSION" >> $GITHUB_OUTPUT

  build:
    needs: determine-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [phone, tv]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > jellyplay-release.jks

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      # GMD emulator needs writable /dev/kvm. ubuntu runners expose it, but not
      # always world/group-accessible for the runner user — apply the same udev
      # rule android-emulator-runner uses, then fail fast with a clear message
      # if the runner genuinely lacks nested virtualization. Only the phone leg
      # generates a baseline profile (on a managed emulator), so strictly only
      # it needs KVM, but keep the guard unconditional to catch runner
      # regressions on both legs.
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || { echo "::error::/dev/kvm missing — runner has no nested virtualization, emulator cannot start"; exit 1; }
          /usr/local/lib/android/sdk/emulator/emulator -accel-check || true

      # Generates the ART baseline/startup profile on a headless Gradle Managed
      # Device and writes baseline-prof.txt + startup-prof.txt into the app's
      # <flavor>Release sources; the androidx.baselineprofile consumer plugin
      # merges them into the release APK automatically during assemble.
      # Phone only — AGP cannot run TV images on Gradle Managed Devices, so the
      # tv flavor ships without generated profiles.
      # -PbuildUniversal=true (BIN-3): this step assembles and installs the
      # app's release APKs on the x86_64 ciPixel8 GMD — keep its APK set
      # identical to what it built before the universal-APK gating (the
      # universal APK is where the emulator's ABI coverage came from).
      - name: Generate Baseline Profile
        if: matrix.flavor == 'phone'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:generate${{ matrix.flavor == 'phone' && 'Phone' || 'Tv' }}ReleaseBaselineProfile -PversionName="${{ needs.determine-version.outputs.apk_version }}" -PversionCode="${{ github.run_number }}" -PbuildUniversal=true

      # STA-8 (audit): saveInSrc writes the generated profiles into
      # app/src/phoneRelease/generated/baselineProfiles (baseline-prof.txt /
      # startup-prof.txt). The generate step can silently produce nothing
      # (emulator flake, runner regressions) and the lane would still ship a
      # profile-less release APK — fail it here instead, before the assemble
      # step reuses an empty profile source set.
      - name: Verify Baseline Profile Artifacts
        if: matrix.flavor == 'phone'
        run: |
          profile_dir="app/src/phoneRelease/generated/baselineProfiles"
          shopt -s nullglob
          profs=("$profile_dir"/*.prof "$profile_dir"/baseline-prof.txt "$profile_dir"/startup-prof.txt)
          if [ ! -d "$profile_dir" ] || [ ${#profs[@]} -eq 0 ]; then
            echo "::error::No baseline profile files were written to $profile_dir"
            ls -laR app/src/phoneRelease 2>/dev/null || true
            exit 1
          fi
          echo "Baseline profile artifacts present:"
          ls -la "$profile_dir"

      - name: Build Android App (Release - ${{ matrix.flavor }})
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # -PbuildUniversal=true (BIN-3): the universal APK is opt-in since the
        # splits gating; this lane is its only consumer (the rename step's
        # known_abis list includes it), so pass the property and the published
        # artifact set stays byte-identical.
        run: ./gradlew assemble${{ matrix.flavor == 'phone' && 'Phone' || 'Tv' }}Release -PversionName="${{ needs.determine-version.outputs.apk_version }}" -PversionCode="${{ github.run_number }}" -PbuildUniversal=true

      - name: Rename APK Outputs
        run: |
          VERSION="${{ needs.determine-version.outputs.apk_version }}"
          shopt -s nullglob
          apks=(app/build/outputs/apk/*/*/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "ERROR: No APK files found"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            filename=$(basename "$apk")
            rest="${filename#app-}"
            tmp="${rest%-release.apk}"
            known_abis="arm64-v8a armeabi-v7a x86_64 universal"
            matched=false
            for known in $known_abis; do
              if [[ "$tmp" == *"-$known" ]]; then
                flavor="${tmp%-$known}"
                abi="$known"
                if [ -n "$flavor" ]; then
                  new_filename="jellyplay-v${VERSION}-${flavor}-${abi}.apk"
                else
                  new_filename="jellyplay-v${VERSION}-${abi}.apk"
                fi
                matched=true
                break
              fi
            done
            if [ "$matched" = false ]; then
              echo "Unknown APK naming format: $filename"
              continue
            fi
            mv "$apk" "$new_filename"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}
          path: jellyplay-*.apk
          retention-days: 7

  release:
    needs: [determine-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ needs.determine-version.outputs.tag }}"
          name: "Release ${{ needs.determine-version.outputs.tag }}"
          files: apks/jellyplay-*.apk
          generate_release_notes: true
          make_latest: true
