name: Release

on:
  push:
    branches:
      - 'v[0-9]+*'
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      apk_version: ${{ steps.version.outputs.apk_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Release Version
        id: version
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          BASE_VERSION=$(echo "$BRANCH_NAME" | grep -oE '(?:^|/)[v]?([0-9]+\.[0-9]+(\.[0-9]+)?)' | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1)
          if [ -z "$BASE_VERSION" ]; then BASE_VERSION="1.0.0"; fi

          IFS='.' read -r major minor patch <<< "$BASE_VERSION"
          minor=${minor:-0}
          patch=${patch:-0}

          BASE_PREFIX="v${major}.${minor}"

          latest_tag=$(git tag -l "${BASE_PREFIX}.*" | sort -V | tail -n 1)

          if [ -n "$latest_tag" ]; then
              latest_patch=${latest_tag##*.}
              new_patch=$((latest_patch + 1))
              NEW_TAG="${BASE_PREFIX}.${new_patch}"
              NEW_APK_VERSION="${major}.${minor}.${new_patch}"
          else
              NEW_TAG="${BASE_PREFIX}.${patch}"
              NEW_APK_VERSION="${major}.${minor}.${patch}"
          fi

          echo "Next tag computing to: $NEW_TAG"
          echo "Next APK version: $NEW_APK_VERSION"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "apk_version=$NEW_APK_VERSION" >> $GITHUB_OUTPUT

  build:
    needs: determine-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [phone, tv]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > jellyplay-release.jks

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      # Generates the ART baseline/startup profile on a headless Gradle Managed
      # Device (ubuntu runners expose /dev/kvm) and writes baseline-prof.txt +
      # startup-prof.txt into the app's phoneRelease sources; the
      # androidx.baselineprofile consumer plugin merges them into the release
      # APK automatically during assemble. Phone only — the :baselineprofile
      # generator module targets the phone applicationId.
      - name: Generate Baseline Profile
        if: matrix.flavor == 'phone'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:generatePhoneReleaseBaselineProfile -PversionName="${{ needs.determine-version.outputs.apk_version }}" -PversionCode="${{ github.run_number }}"

      - name: Build Android App (Release - ${{ matrix.flavor }})
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assemble${{ matrix.flavor == 'phone' && 'Phone' || 'Tv' }}Release -PversionName="${{ needs.determine-version.outputs.apk_version }}" -PversionCode="${{ github.run_number }}"

      - name: Rename APK Outputs
        run: |
          VERSION="${{ needs.determine-version.outputs.apk_version }}"
          shopt -s nullglob
          apks=(app/build/outputs/apk/*/*/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "ERROR: No APK files found"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            filename=$(basename "$apk")
            rest="${filename#app-}"
            tmp="${rest%-release.apk}"
            known_abis="arm64-v8a armeabi-v7a x86_64 universal"
            matched=false
            for known in $known_abis; do
              if [[ "$tmp" == *"-$known" ]]; then
                flavor="${tmp%-$known}"
                abi="$known"
                if [ -n "$flavor" ]; then
                  new_filename="jellyplay-v${VERSION}-${flavor}-${abi}.apk"
                else
                  new_filename="jellyplay-v${VERSION}-${abi}.apk"
                fi
                matched=true
                break
              fi
            done
            if [ "$matched" = false ]; then
              echo "Unknown APK naming format: $filename"
              continue
            fi
            mv "$apk" "$new_filename"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}
          path: jellyplay-*.apk
          retention-days: 7

  release:
    needs: [determine-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK Artifacts
        uses: actions/download-artifact@v8
        with:
          path: apks
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ needs.determine-version.outputs.tag }}"
          name: "Release ${{ needs.determine-version.outputs.tag }}"
          files: apks/jellyplay-*.apk
          generate_release_notes: true
          make_latest: true
