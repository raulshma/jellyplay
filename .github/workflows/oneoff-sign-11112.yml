name: One-off sign fdroid 11112 reference binary
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Sign the buildserver's unsigned rebuild
        run: |
          set -euo pipefail
          TAG=v0.11.11
          curl -sL "https://github.com/raulshma/jellyplay/releases/download/$TAG/unsigned-11112-staging.apk" -o /tmp/unsigned.apk
          # sanity: it must be unsigned and carry the W-attractor dexes
          unzip -qo /tmp/unsigned.apk classes.dex -d /tmp/chk
          SHA=$(sha256sum /tmp/chk/classes.dex | cut -d' ' -f1)
          [ "$SHA" = "76fbbcd4c09ce6251a3cff938b5b9cb4dea6196c9b36d04db8828817ff763557" ] || { echo "::error::unexpected classes.dex $SHA"; exit 1; }
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/jellyplay-release.jks
          BT=$ANDROID_HOME/build-tools
          ls -d $BT/* | sort -V | tail -1
          BT=$(ls -d $BT/* | sort -V | tail -1)
          # v2-only, matching every other fdroid reference binary (v1 false, v2 true)
          $BT/apksigner sign --ks /tmp/jellyplay-release.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false \
            --out /tmp/signed.apk /tmp/unsigned.apk
          $BT/apksigner verify --print-certs /tmp/signed.apk | head -5
          DEST=jellyplay-$TAG-fdroid-11112.apk
          cp /tmp/signed.apk /tmp/$DEST
          sha256sum /tmp/$DEST
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Attach signed reference binary
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.11.11
          files: /tmp/jellyplay-v0.11.11-fdroid-11112.apk
      - name: Drop staging asset
        run: gh release delete-asset v0.11.11 unsigned-11112-staging.apk -y
        env:
          GH_TOKEN: ${{ github.token }}
