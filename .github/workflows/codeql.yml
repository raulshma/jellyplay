name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.kts'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.jsx'
      - '**/*.tsx'
      - '**/*.yaml'
      - '**/*.yml'
      - 'gradle/**'
      - '**/libs.versions.toml'
      - '.github/workflows/**'
      - '.github/codeql/**'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted ubuntu-latest runners ship 16 GB RAM. The Kotlin compiler
      # daemon (36 modules compiled in parallel by default) OOMs during the
      # autobuild. Add 10 GB of swap so the build can spill without being killed
      # — same fix Nextcloud/android uses in their CodeQL workflow.
      - name: Set Swap Space
        if: matrix.language == 'java-kotlin' && runner.environment == 'github-hosted'
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # v1.0
        with:
          swap-size-gb: 10

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml

      # Override the project's gradle.properties (tuned for a local 15 GB / 18
      # core dev box) with CI-safe values, without touching the committed file.
      # Without this, the Kotlin daemon default heap runs out on 36 parallel
      # modules. Manual mode + assembleDebug avoids the release/R8 fullMode
      # build that CodeQL source analysis does not need.
      - name: Build for analysis (debug variant only)
        if: matrix.language == 'java-kotlin'
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC
          org.gradle.parallel=false
          org.gradle.caching=false
          org.gradle.configuration-cache=false
          org.gradle.workers.max=2
          EOF
          ./gradlew --no-daemon assembleDebug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
