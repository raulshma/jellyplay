name: F-Droid release binaries

# Build, verify and publish the developer-signed F-Droid reference binaries
# (the `Binaries:` URLs in the fdroiddata metadata expand to
# releases/download/v%v/jellyplay-v%v-fdroid-%c.apk — fdroidserver's
# buildserver rebuilds the same commit and byte-compares against these).
#
# Triggers:
#  * release published — the stable draft from release.yml becomes
#    published; this lane then attaches the two fdroid APKs to that same
#    release. NOTE: release-triggered workflows run from the DEFAULT branch,
#    so automation arms only once this file lands on main.
#  * workflow_dispatch with a tag input — backfill path (e.g. building
#    v0.11.9 binaries for the inclusion MR) and manual re-runs.
#
# Buildserver parity (the whole point of this lane): the job runs in
# a debian:trixie CONTAINER with Debian's own default-jdk-headless, because
# the JDK BUILD is byte-relevant — kotlinc/R8 emit different dex bytes
# under Temurin's OpenJDK 21 than under Debian's (proven on v0.11.10: two
# stable dex variants, identical class sets and string tables, different
# code bytes; the fdroiddata CI byte-compare failed until we matched the
# JDK). See docs/fdroid/README.md §6 for the mapping table.
#
# TOPOLOGY PARITY (v0.11.11 post-mortems — mechanism pinned via pipeline #43
# artifact forensics): the buildserver builds BOTH ABIs SEQUENTIALLY in one
# job — a fresh source tree re-copied into the SAME build/<pkg> path per
# build, sharing one persistent Gradle home. The SECOND build's (x86_64)
# dexes are byte-identical to the FIRST build's — proven by diffing the
# buildserver's kept failed-build artifact against the arm64 reference.
# The same-path detail is load-bearing: an earlier two-clone layout
# (/job/c1, /job/c2) made build 2's R8 output diverge (one Kotlin
# closeFinally specialization in class hse, ~2KB dex delta). This job
# mirrors the topology exactly: ONE job, ONE path (/job/tree) — clone,
# build arm64, wipe, re-clone, build x86_64 — sharing one Gradle home.
# (An earlier theory pinned the flip on Gradle's parallel + build-cache
# dedup race; that race is real but only a correlate — the buildserver
# flipped even serial and cacheless. PR #211 removed ONE app-side
# closeFinally-on-Response construct, but v0.11.12 flipped again on a
# LIBRARY-borne closeFinally outline (class hse): the root cause is R8
# itself — worklist-order nondeterminism in phi-type recomputation,
# issuetracker.google.com 554586985 / 565508292. The permanent fix is
# systemProp.com.android.tools.r8.deterministicdebugging=true in
# gradle.properties (R8 threadCount=1 + IdentityIROrdering), which every
# build picks up — buildserver included, no lane-side sed. Verified
# locally: flag-on parallel and serial R8 runs are byte-identical; flag-off
# runs reproduce both buildserver/CI attractor states. Topology parity
# below is kept to mirror the buildserver, not to tame the flip.)
# c2 hard-verifies dex-equality with c1, so the reproducibility invariant
# can never silently rot.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g. v0.11.9) — stable vX.Y.Z only'
        required: true

# Per-tag serialization: a re-dispatch must not race the previous run's
# asset upload for the same release.
concurrency:
  group: fdroid-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

# Least-privilege default: the build only reads; only attach-release
# writes (release assets).
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    container:
      # The fdroidserver buildserver basebox is debian/trixie64. trixie has
      # no git, so the tag is cloned manually (public repos — no auth)
      # after the toolchain step instead of using actions/checkout.
      image: debian:trixie
    env:
      TAG_NAME: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Install buildserver toolchain
        # Mirrors the buildserver provisioning: debian/trixie64 with
        # default-jdk-headless (= Debian's OpenJDK 21 build — NOT a
        # cross-vendor stand-in; see the header comment), a writable SDK
        # root, and git for the clone. AGP auto-installs the platform and
        # build-tools it needs once licenses are accepted, same as on the
        # basebox. The cmdline-tools pin tracks dl.google.com's live
        # inventory — Google rotates these zips and deletes the old ones
        # (13158590 404ed on 2026-11-12 mid-release; check the repository
        # index when it rots again).
        run: |
          apt-get update -qq
          apt-get install -y -qq default-jdk-headless git unzip wget >/dev/null
          SDK=/opt/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -O /tmp/clt.zip
          unzip -q /tmp/clt.zip -d /tmp/clt
          mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes) > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "ndk;28.2.13676358" < <(yes) > /dev/null

      - name: Checkout tag (one path, reused per build)
        # The buildserver re-copies the source into the SAME build/<pkg>
        # path for every build of a version — and the absolute tree path
        # is a real variable in R8's output (the /job/c1 vs /job/c2
        # two-clone layout produced a divergent dex on v0.11.11). This
        # lane therefore also uses ONE path: clone, build arm64, wipe,
        # re-clone into the identical path, build x86_64. Manual clone:
        # debian:trixie has no git until the step above installs it, and
        # actions/checkout needs git for recursive submodules. Public
        # repo, so no token is needed.
        run: |
          if ! grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$TAG_NAME"; then
            echo "::error::Tag '$TAG_NAME' is not a stable vX.Y.Z release — skipping"
            exit 1
          fi
          git clone --depth 1 --branch "$TAG_NAME" --recurse-submodules \
            https://github.com/raulshma/jellyplay /job/tree
          git -C /job/tree log -n1 --pretty='%H %s'
          mkdir -p /job/out

      - name: Setup Gradle
        # cache-disabled is LOAD-BEARING: setup-gradle restores the Gradle
        # build cache from EARLIER RUNS of this lane, and on 2026-11-12 the
        # re-dispatch replayed a previous run's outputs wholesale (550
        # FROM-CACHE hits) — attaching stale bytes under a green checkmark,
        # in 4 minutes. Cross-run cache must never leak in. The LOCAL cache
        # within this job is the opposite: c2's R8 MUST hit c1's cache entry
        # (see the c2 step) — that is the buildserver's actual topology.
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Decode Keystore
        # The same one-liner as .github/actions/setup-gmd-runner, inlined
        # because that composite action hard-requires /dev/kvm (GMD
        # emulator prereq) which this lane never needs. The signingConfig
        # resolves the keystore relative to the tree root; the copy at
        # /job/ survives the c2 re-clone.
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /job/jellyplay-release.jks
          cp /job/jellyplay-release.jks /job/tree/jellyplay-release.jks
          chmod +x /job/tree/gradlew

      - name: Build + verify c1 (arm64-v8a, build 1)
        # Mirrors the metadata's FIRST build entry verbatim: prebuild seds,
        # rm, NDK via the metadata `ndk:` (installed above), --no-daemon,
        # JVM auto-download off, SOURCE_DATE_EPOCH = last commit's epoch,
        # LC_ALL=C.UTF-8. abi_index 1 = arm64-v8a per
        # app/build.gradle.kts abiVersionIndexes; NEVER pass -PversionCode.
        # SEQUENTIAL ORDER IS LOAD-BEARING: this build warms the shared
        # Gradle home exactly as buildserver build 1 warms the basebox's,
        # so c2 below replays the same lineage as buildserver build 2.
        working-directory: /job/tree
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ABI: arm64-v8a
          ABI_INDEX: 1
        run: |
          sed -i -e '/foojay-resolver/d' -e '/jogamp.org/d' -e '/apps:desktop/d' settings.gradle.kts
          rm -rf apps/desktop
          echo "SOURCE_DATE_EPOCH=$(git log -n1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "LC_ALL=C.UTF-8" >> "$GITHUB_ENV"
          ./gradlew --no-daemon \
            -Porg.gradle.java.installations.auto-download=false \
            :app:assemblePhoneFdroidRelease -PabiFilter=$ABI --stacktrace \
            2>&1 | tee /tmp/build-c1.log
          # R8 must EXECUTE here — this is the one real minify run whose
          # dexes both this APK and c2's must carry. (FROM-CACHE on
          # no-op resource-parse tasks is normal even in a fresh
          # container — modules with identical empty inputs share cache
          # keys within a single build; the buildserver shows the same.)
          if grep -q 'Task :app:minifyPhoneFdroidReleaseWithR8 FROM-CACHE' /tmp/build-c1.log; then
            echo "::error::R8 was FROM-CACHE in build 1 — a cache entry leaked in from an earlier run. Build 1 must be the real R8 run. Refusing."
            exit 1
          fi
          # Verify + rename inline (NOT a helper script: this lane builds the
          # TAG tree, which predates anything added to main after the cut).
          VERSION=$(grep -oP '(?<=^jellyplay\.versionName=)\S+' version.properties)
          BASE=$(grep -oP '(?<=^jellyplay\.versionCode=)\d+' version.properties)
          CODE=$((BASE + ABI_INDEX))
          if [ "v${VERSION}" != "${TAG_NAME}" ]; then
            echo "::error::version.properties says v${VERSION} but building ${TAG_NAME} — version.properties was not bumped for this tag"
            exit 1
          fi
          APK=$(ls app/build/outputs/apk/phoneFdroid/release/*-"$ABI"-release.apk)
          tools/fdroid/verify-apk.sh --expect-version-code "$CODE" "$APK"
          # Stash c1's APK + dexes for the c2 dex-equality invariant and
          # the artifact upload — the tree is wiped before c2.
          unzip -qo "$APK" 'classes*.dex' 'assets/dexopt/baseline.prof' -d /job/out/dex1
          cp "$APK" /job/out/
          # The exact filename fdroidserver's Binaries: template expands to.
          # The store updater ignores these by construction: its asset
          # matcher requires a -phone-/-tv- prefix and an
          # -<abi>.apk/-universal.apk suffix (GitHubReleasesApiImpl.kt).
          DEST="jellyplay-v${VERSION}-fdroid-${CODE}.apk"
          mv "/job/out/$(basename "$APK")" "/job/out/$DEST"
          echo "sha256 of the published reference binary:"
          sha256sum "/job/out/$DEST"

      - name: Build + verify c2 (x86_64, build 2 — warm lineage)
        # Second buildserver build: FRESH TREE AT THE SAME ABSOLUTE PATH
        # (fdroidserver re-copies the source into build/<pkg> per build),
        # shared now-warm Gradle home. abi_index 2 = x86_64. c2's R8
        # re-executes and must land on c1's exact dexes — the
        # gradle.properties determinism flag pins both runs.
        working-directory: /job
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ABI: x86_64
          ABI_INDEX: 2
        run: |
          rm -rf /job/tree
          git clone -q --depth 1 --branch "$TAG_NAME" --recurse-submodules \
            https://github.com/raulshma/jellyplay /job/tree
          cp /job/jellyplay-release.jks /job/tree/jellyplay-release.jks
          chmod +x /job/tree/gradlew
          cd /job/tree
          sed -i -e '/foojay-resolver/d' -e '/jogamp.org/d' -e '/apps:desktop/d' settings.gradle.kts
          rm -rf apps/desktop
          ./gradlew --no-daemon \
            -Porg.gradle.java.installations.auto-download=false \
            :app:assemblePhoneFdroidRelease -PabiFilter=$ABI --stacktrace
          # THE WARM-LINEAGE INVARIANT: c2's dexes must be byte-identical
          # to c1's. A divergent R8 run (the /job/c2 two-path layout on
          # v0.11.11: one closeFinally specialization in class hse) fails
          # the fdroiddata byte-compare, so fail here first, loudly.
          APK2=$(ls app/build/outputs/apk/phoneFdroid/release/*-"$ABI"-release.apk)
          rm -rf /tmp/dex2 && mkdir /tmp/dex2
          unzip -qo "$APK2" 'classes*.dex' 'assets/dexopt/baseline.prof' -d /tmp/dex2
          if ! diff -r /job/out/dex1 /tmp/dex2; then
            echo "::error::c2 dexes differ from c1's — the warm lineage broke (buildserver build 2's dexes equal build 1's). Refusing."
            exit 1
          fi
          # Same inline verify + rename as c1 (see there for why not a helper
          # script): the lane builds the TAG tree.
          VERSION=$(grep -oP '(?<=^jellyplay\.versionName=)\S+' version.properties)
          BASE=$(grep -oP '(?<=^jellyplay\.versionCode=)\d+' version.properties)
          CODE=$((BASE + ABI_INDEX))
          if [ "v${VERSION}" != "${TAG_NAME}" ]; then
            echo "::error::version.properties says v${VERSION} but building ${TAG_NAME} — version.properties was not bumped for this tag"
            exit 1
          fi
          APK=$(ls app/build/outputs/apk/phoneFdroid/release/*-"$ABI"-release.apk)
          tools/fdroid/verify-apk.sh --expect-version-code "$CODE" "$APK"
          DEST="jellyplay-v${VERSION}-fdroid-${CODE}.apk"
          cp "$APK" "/job/out/$DEST"
          echo "sha256 of the published reference binary:"
          sha256sum "/job/out/$DEST"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-apks
          path: /job/out/jellyplay-*-fdroid-*.apk
          retention-days: 7
          if-no-files-found: error

  attach-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: 'fdroid-apks'

      - name: Flatten APKs to dist root and verify
        # Defense in depth (the 2026-11-12 attach bug: a glob that matched
        # nothing warned instead of failing, so a re-dispatch "succeeded"
        # while attaching zero bytes). Flatten anything nested, then
        # hard-fail unless both APKs sit at the dist root.
        run: |
          find dist -mindepth 2 -name '*.apk' -print -exec mv -t dist {} +
          N=$(find dist -maxdepth 1 -name '*.apk' | wc -l)
          echo "APKs at dist/ root: $N"
          [ "$N" -eq 2 ] || {
            echo "::error::expected exactly 2 APKs at dist/ root, found $N — refusing to attach"
            exit 1
          }

      - name: Attach to release
        # Uploads to the existing vX.Y.Z release (published draft for the
        # release-event path; the already-published release for backfills).
        # Same-named assets are REPLACED — a re-dispatch after a toolchain
        # fix swaps the bytes under the identical Binaries: URLs.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: dist/*.apk
