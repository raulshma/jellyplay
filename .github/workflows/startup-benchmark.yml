# Startup macrobenchmark lane (perf audit follow-up): StartupBenchmark.kt
# existed in :baselineprofile but nothing in CI ever ran it, so baseline-profile
# quality had no numeric gate — a silently narrow profile (emulator flake in the
# generate lane) would ship unnoticed. This lane boots the same ciPixel8 GMD the
# profile generator uses and runs ONLY the startup benchmark (class-filtered —
# running the module's full suite would also execute BaselineProfileGenerator,
# which is the release lane's job, not this one).
#
# CompilationMode.None() measures whatever AOT state the installed APK carries,
# so this lane must benchmark a CI-assembled nonMinifiedRelease APK (which merges
# the committed saveInSrc profiles from app/src/phoneRelease) — a locally built
# release without committed profiles would produce misleading baselines.
#
# Manual dispatch plus a weekly schedule: numbers land in the run's uploaded
# report for comparison against previous runs; failure semantics stay on the
# macrobenchmark itself (no threshold gate yet — collect data first).
name: Startup Benchmark

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 03:00 UTC — off-peak for GitHub-hosted runners.
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  startup-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Keystore + gradlew + KVM — the shared GMD-runner prereqs
      # (.github/actions/setup-gmd-runner).
      - name: Setup GMD Runner
        uses: ./.github/actions/setup-gmd-runner
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Run Startup Benchmark
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew :baselineprofile:ciPixel8NonMinifiedReleaseAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=com.raulshma.jellyplay.baselineprofile.StartupBenchmark
          "-Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR"
          --stacktrace

      - name: Upload Benchmark Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-benchmark-report
          path: |
            baselineprofile/build/outputs/connected_android_test_additional_output/
            baselineprofile/build/outputs/androidTest-results/
          if-no-files-found: warn
