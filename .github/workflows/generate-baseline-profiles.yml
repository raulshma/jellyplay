# Baseline-profile generation lane: the ONLY place profiles are generated.
# release.yml no longer regenerates in-lane (that GMD run cost ~50 min per
# cut, on the critical path, for a freshness delta of at most days) — it
# assembles straight from the committed saveInSrc tree
# (app/src/phoneStoreRelease/generated/baselineProfiles) and hard-gates on its
# presence. Keeping that tree fresh is this lane's job.
#
# Refresh cadence: weekly cron (Sunday 04:00 UTC — offset from
# startup-benchmark.yml's 03:00 so the two GMD lanes never contend) commits
# to the default branch, plus workflow_dispatch so a human can refresh any
# branch on demand (the recovery recipe when the release lane's hard gate
# fires). Store APK profiles can therefore trail main by at most a week;
# stale rules are simply dropped at profile-compile time, and F-Droid
# reproducibility is unaffected — its lane builds from the same committed
# tree on both sides of the byte-compare.
#
# Local generation note: Gradle Managed Device boot of the ciPixel8 AOSP image
# fails on many Windows dev boxes (GMD "No matching Apks found" after an
# emulator timeout — no nested-virtualization support); this lane is the
# reliable path, not local runs.
name: Generate Baseline Profiles

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 04:00 UTC — off-peak, and one hour after the
    # startup-benchmark lane's own GMD run.
    - cron: '0 4 * * 0'

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Keystore + gradlew + KVM — the shared GMD-runner prereqs
      # (.github/actions/setup-gmd-runner).
      - name: Setup GMD Runner
        uses: ./.github/actions/setup-gmd-runner
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Generate Baseline Profile
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # -PbuildUniversal=true is REQUIRED here: the default split config
        # is arm64-only (the universal
        # APK is gated behind this property), and the x86_64 ciPixel8 GMD has
        # no arm64 ABI to install — without the flag the task dies with
        # "No matching Apks found for ciPixel8" (both Oct-2026 dispatches).
        run: ./gradlew :app:generatePhoneStoreReleaseBaselineProfile -PbuildUniversal=true --stacktrace

      # Same both-artifacts-must-exist gate the release lane applies — a
      # partial/empty write must fail here, not land as a "refreshed" commit.
      - name: Verify Baseline Profile Artifacts
        run: |
          profile_dir="app/src/phoneStoreRelease/generated/baselineProfiles"
          missing=()
          for f in "$profile_dir/baseline-prof.txt" "$profile_dir/startup-prof.txt"; do
            [ -s "$f" ] || missing+=("$f")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing baseline profile artifacts: ${missing[*]}"
            exit 1
          fi

      - name: Commit Generated Profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/phoneStoreRelease/generated/baselineProfiles/
          if git diff --cached --quiet; then
            echo "Generated profiles are identical to the committed ones — nothing to commit."
          else
            git commit -m "chore(baselineprofile): refresh committed phone release profiles [skip ci]"
            git push
          fi
