# Baseline-profile generation lane: the ONLY place profiles are generated.
# release.yml no longer regenerates in-lane (that GMD run cost ~50 min per
# cut, on the critical path, for a freshness delta of at most days) — it
# assembles straight from the committed saveInSrc tree
# (app/src/phoneStoreRelease/generated/baselineProfiles) and hard-gates on its
# presence. Keeping that tree fresh is this lane's job.
#
# Refresh cadence: weekly cron (Sunday 04:00 UTC — offset from
# startup-benchmark.yml's 03:00 so the two GMD lanes never contend) opens a
# refresh PR against the default branch for a human to merge (ruleset
# potec-base blocks direct pushes there), plus workflow_dispatch so a human
# can refresh any branch on demand (the recovery recipe when the release
# lane's hard gate fires). Store APK profiles can therefore trail main by at most a week;
# stale rules are simply dropped at profile-compile time, and F-Droid
# reproducibility is unaffected — its lane builds from the same committed
# tree on both sides of the byte-compare.
#
# Local generation note: Gradle Managed Device boot of the ciPixel8 AOSP image
# fails on many Windows dev boxes (GMD "No matching Apks found" after an
# emulator timeout — no nested-virtualization support); this lane is the
# reliable path, not local runs.
name: Generate Baseline Profiles

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 04:00 UTC — off-peak, and one hour after the
    # startup-benchmark lane's own GMD run.
    - cron: '0 4 * * 0'

permissions:
  # contents: push the refresh branch; pull-requests: let `gh` create and
  # squash-merge the refresh PR (GraphQL needs the explicit scope — contents
  # alone gets a 403 "Resource not accessible by integration").
  contents: write
  pull-requests: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Keystore + gradlew + KVM — the shared GMD-runner prereqs
      # (.github/actions/setup-gmd-runner).
      - name: Setup GMD Runner
        uses: ./.github/actions/setup-gmd-runner
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Generate Baseline Profile
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # -PbuildUniversal=true is REQUIRED here: the default split config
        # is arm64-only (the universal
        # APK is gated behind this property), and the x86_64 ciPixel8 GMD has
        # no arm64 ABI to install — without the flag the task dies with
        # "No matching Apks found for ciPixel8" (both Oct-2026 dispatches).
        run: ./gradlew :app:generatePhoneStoreReleaseBaselineProfile -PbuildUniversal=true --stacktrace

      # Same both-artifacts-must-exist gate the release lane applies — a
      # partial/empty write must fail here, not land as a "refreshed" commit.
      - name: Verify Baseline Profile Artifacts
        run: |
          profile_dir="app/src/phoneStoreRelease/generated/baselineProfiles"
          missing=()
          for f in "$profile_dir/baseline-prof.txt" "$profile_dir/startup-prof.txt"; do
            [ -s "$f" ] || missing+=("$f")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing baseline profile artifacts: ${missing[*]}"
            exit 1
          fi

      # main is under ruleset potec-base ("changes must be made through a pull
      # request", no bypass actors), so a direct push dies with GH013 — the
      # Nov-2026 cron failure. Land the refresh as a bot PR instead: the
      # ruleset demands 0 approvals and no required checks, so it is safe to
      # merge on sight. [skip ci] on the head commit keeps the repo's PR-lane
      # CI off the refresh PR (profile data only); on the squash subject it
      # keeps push-lane CI off the base branch when it merges — what the old
      # direct-push [skip ci] bought. Dispatching on a branch refreshes that
      # branch; the PR lands wherever the run started.
      - name: Commit Profiles and Open Refresh PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/phoneStoreRelease/generated/baselineProfiles/
          if git diff --cached --quiet; then
            echo "Generated profiles are identical to the committed ones — nothing to commit."
            exit 0
          fi
          branch="baseline-profiles/refresh-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git commit -m "chore(baselineprofile): refresh committed phone release profiles [skip ci]"
          git push origin "$branch"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --title "chore(baselineprofile): refresh committed phone release profiles [skip ci]" \
            --body "Automated baseline-profile refresh from [run $GITHUB_RUN_ID]($run_url). Profile data only — CI skips this PR by design ([skip ci] head commit); review the diff and merge. Squash keeps the [skip ci] subject on the base branch."
