name: KMP Build

# Shared-tree (KMP) verification (see docs/kmp-migration-plan.md).
# Compiles every configured target of the shared/ tree on all three desktop
# OSes and runs its common tests. The android-app job below covers the :app
# module itself — its phone/tv unit tests and the phoneDebug APK
# compose-resources guard.

on:
  push:
    # kmp-alpha included: it receives direct dev/v* merges that never open a
    # PR, which let three test regressions (MigrationTest WAL replay,
    # getText null-idiom, UpdateCoordinatorTest signature drift) land
    # unverified during the v0.10.6 merges.
    branches: ['main', 'master', 'kmp-alpha']
  pull_request:
    # Skip doc-only PRs entirely (paths-ignore fires only when EVERY changed
    # file matches — a mixed .md+.kt PR still runs). Safe without branch
    # protection: no required status contexts exist on main/dev, so nothing
    # can get stuck on a skipped check.
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**/*.md'
      - '*.md'
      - 'fastlane/metadata/**'
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN for every job in this workflow — checkout,
# build, test, and artifact upload need no write scopes (CodeQL
# actions/missing-workflow-permissions).
permissions:
  contents: read

# Keyed on the HEAD BRANCH within each event type, not github.ref: pushing
# kmp-alpha with an open PR fires BOTH the push event (ref
# refs/heads/kmp-alpha) and pull_request synchronize (ref refs/pull/N/merge)
# — distinct github.ref values meant the cancel-in-progress guard never
# matched and every commit built the full matrix twice. Branch keying within
# an event keeps that dedup. The EVENT PREFIX keeps the two event types in
# separate groups: a PR run must never cancel a push run, because the
# push-only fdroid-smoke job below is now the sole runner of the F-Droid
# R8 smoke gate — a cancelled push run would leave the commit without it.
concurrency:
  group: kmp-build-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

# bash on every OS: pwsh choked on the folded multi-line Gradle invocations
# (ParserError at line 18) and mangled -PjellyplayVersion=0.1.0 into '0' on
# windows-latest. bash ships on all three hosted runners, and with the
# gradlew exec bit restored in git, ./gradlew runs everywhere unchanged.
defaults:
  run:
    shell: bash

env:
  # gradle/gradle-daemon-jvm.properties pins the Gradle daemon to JDK 21 with
  # hardcoded foojay download URLs. windows runners keep their JDKs in
  # hostedtoolcache, which Gradle's auto-detection does not scan, so the
  # windows daemon falls back to the foojay redirect URL — which answers 400
  # to Actions egress (2026-10: both windows jobs died at daemon start while
  # ubuntu/macos found a local 21). setup-java (below) installs 21 too and
  # exports JAVA_HOME_21_X64; this property adds that env var to Gradle's
  # detection sources so the daemon criteria resolve locally on every OS.
  # JAVA_HOME itself stays on 17 (the LAST version in setup-java's list wins)
  # so the jvmToolchain(17) build lane never downloads a JDK either.
  GRADLE_OPTS: -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

jobs:
  shared-targets:
    # ubuntu-only (was ×3 OS): every shared module declares only jvm() +
    # android targets (KmpLibraryBasePlugin), so this job's work is
    # OS-independent and the win+mac legs only re-ran the same tests ~3×
    # slower — they were the workflow's critical path. Cross-OS JVM compile
    # coverage stays via desktop-package below.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        # submodules: recursive — the plugin tree (jellyfin-plugin-jellyplay)
        # carries the committed settings-catalog artifact the datastore
        # golden-file test (SettingsCatalogGeneratorTest) opens; without it
        # every shared-targets OS fails with "settings catalog artifact
        # missing".
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17 + 21
        # 17 is the build toolchain (jvmToolchain(17), AGP) and stays JAVA_HOME
        # (last listed version wins); 21 satisfies the Gradle daemon JVM
        # criteria (gradle-daemon-jvm.properties) via GRADLE_OPTS above —
        # required on windows, whose hostedtoolcache layout Gradle can't
        # auto-detect.
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            21
            17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Write caches on push/dispatch and same-repo PRs (iterative pushes
          # restore the previous push's caches); fork PRs stay read-only —
          # untrusted code must never poison the shared cache.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Derive shared module lanes from settings.gradle.kts
        id: shared-modules
        # SINGLE SOURCE OF TRUTH for both lanes below: every
        # include(":shared:…") in settings.gradle.kts gets a
        # jvmJar+compileAndroidMain pair (build lane) and a jvmTest (test
        # lane), derived here instead of hand-maintained. The hand lists were
        # the failure mode twice over: photos/shell/player-book/test-fixtures
        # shipped full local suites that ran in NO lane, and
        # :shared:core:test-fixtures was missing from the build lane even
        # after its tests were added (a module matched the old
        # SharedModuleCiLaneGuardTest via its jvmTest line alone). Every
        # shared module applies jellyplay.kmp.library.base and carries both
        # targets, so all three tasks exist for every include; a future
        # module that breaks that invariant fails THIS derivation's lane
        # loudly ("task not found") instead of silently skipping coverage.
        # The floor (20) only catches regex rot — an include-style change
        # that makes the scan find nothing — not genuine shrinkage; the
        # repo-side ratchet for the true floor is
        # SharedModuleCiLaneGuardTest (:apps:desktop:test).
        run: |
          set -eu
          modules=$(grep -oE 'include\("(:shared:[^"]+)"\)' settings.gradle.kts | sed -E 's/^include\("([^"]+)"\)$/\1/')
          count=$(printf '%s\n' "$modules" | grep -c . || true)
          if [ -z "$modules" ] || [ "$count" -lt 20 ]; then
            echo "::error::Derived $count ':shared:' modules from settings.gradle.kts — the include-scan rotted (include style changed?) or the tree shrank unexpectedly. Fix the scan in the 'Derive shared module lanes' step."
            exit 1
          fi
          build_tasks=""
          test_tasks=""
          for m in $modules; do
            build_tasks="$build_tasks $m:jvmJar $m:compileAndroidMain"
            test_tasks="$test_tasks $m:jvmTest"
          done
          echo "Derived $count shared modules:"
          printf '  %s\n' $modules
          echo "build_tasks=$build_tasks" >> "$GITHUB_OUTPUT"
          echo "test_tasks=$test_tasks" >> "$GITHUB_OUTPUT"

      - name: Warn on plugin/app version drift
        # Tier-3 drift discipline: the contract-version gate makes a
        # version-mismatched pair degrade gracefully (the capabilities probe
        # refuses out-of-range contracts, the settings screen shows the
        # mismatch banner), so this check is an ANNOTATION, not a gate — it
        # only surfaces a forgotten submodule csproj bump early. Compares the
        # release.yml branch-name derivation against the pinned plugin tree's
        # <Version>; PR checkouts (NN/merge) carry no version segment and skip.
        run: |
          set -eu
          csproj="jellyfin-plugin-jellyplay/src/Jellyfin.Plugin.JellyPlay/Jellyfin.Plugin.JellyPlay.csproj"
          plugin_version=$(grep -oPm1 '(?<=<Version>)[^<]+' "$csproj")
          base_version=$(echo "${GITHUB_REF_NAME}" | grep -oE '(^|/)[v]?[0-9]+\.[0-9]+(\.[0-9]+)?' | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1 || true)
          if [ -z "$base_version" ]; then
            echo "Branch ${GITHUB_REF_NAME} carries no version segment — nothing to compare."
            exit 0
          fi
          plugin_mm=$(echo "$plugin_version" | cut -d. -f1-2)
          app_mm=$(echo "$base_version" | cut -d. -f1-2)
          if [ "$plugin_mm" != "$app_mm" ]; then
            echo "::warning::Plugin/app version drift: the pinned jellyfin-plugin-jellyplay csproj is ${plugin_version} but the branch name implies app version ${base_version}. The contract gate keeps a mismatched pair working, but users on the older side lose the plugin features — bump the csproj (or rename the branch) before release."
          else
            echo "Versions aligned: plugin ${plugin_version}, app ${base_version}."
          fi

      - name: Build shared targets (JVM + Android)
        # The AGP KMP library plugin exposes no per-variant assembleDebug;
        # android target verifies via its single androidMain compilation.
        # Task list is DERIVED above (settings.gradle.kts is the single
        # source of truth). One line, no folded scalar: a blank line inside
        # `run: >` is a hard newline that splits the invocation into separate
        # shell commands (the dev/v0.10.7 merge made bash die on an orphaned
        # mid-list task fragment, exit 127), and a `#` inside the scalar
        # comments out everything after it — which is why the first two
        # OOM-fix attempts were no-ops. The overrides are
        # runner-sized because gradle.properties is tuned for an 18-core dev
        # box (6g daemon, 12 workers) and OOMs the Kotlin daemon on 4-core
        # runners across the full multi-target graph (same medicine
        # codeql.yml takes).
        run: ./gradlew ${{ steps.shared-modules.outputs.build_tasks }} --stacktrace --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" "-Pkotlin.daemon.jvmargs=-Xmx5g -XX:+UseParallelGC"

      - name: Shared tests (JVM)
        # Task list is DERIVED above — every settings.gradle.kts shared
        # include's jvmTest runs (designsystem's empty suite included, as
        # before). The photos/shell/player-book/test-fixtures dark-suite
        # incident can no longer recur: a new include joins the lane by
        # construction, and SharedModuleCiLaneGuardTest (:apps:desktop:test)
        # ratchets the derivation itself.
        run: ./gradlew ${{ steps.shared-modules.outputs.test_tasks }} --stacktrace --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" "-Pkotlin.daemon.jvmargs=-Xmx5g -XX:+UseParallelGC"

      - name: Print test failure details
        # Gradle 9's console prints only one-line "FAILED" entries; the
        # assertion messages live in the JUnit XML. The SelfSignedTrust /
        # datastore failures need their "got $error" text to diagnose.
        if: failure()
        run: |
          shopt -s nullglob
          for f in $(find . -path '*build/test-results*' -name 'TEST-*.xml' 2>/dev/null); do
            grep -q '<failure' "$f" || continue
            echo "===== $f ====="
            sed -n 's/.*<failure message="\([^"]*\)".*/MSG: \1/p' "$f"
            sed -n 's/.*<failure[^>]*>\([^<]\{1,\}\).*/TEXT: \1/p' "$f" | head -c 3000
            echo
          done || true

      - name: Android app androidTest assembly (relocated player-video UI tests)
        # The legacy :feature:player:video androidTest set moved to
        # :app (AGP KMP library plugins expose no androidTest compilation —
        # syncplay relocation precedent); compile-gate it here.
        run: ./gradlew :app:assemblePhoneStoreDebugAndroidTest --stacktrace --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" "-Pkotlin.daemon.jvmargs=-Xmx5g -XX:+UseParallelGC"

      - name: Shell tests (Koin registration guard + packaging asset suites)
        # :apps:desktop:test hosts the Koin-registration ratchet
        # (KoinModuleRegistrationGuardTest) — startKoin wiring is runtime-only
        # and invisible to every compile gate (arrqueue/shortcuts lessons) — plus
        # the DesktopCrashHandlerTest and
        # PackagingIconAssetsTest suites, so it must run in CI, not just
        # locally.
        run: ./gradlew :apps:desktop:test --stacktrace --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" "-Pkotlin.daemon.jvmargs=-Xmx5g -XX:+UseParallelGC"

  android-app:
    # The :app module previously ran in NO
    # lane of this workflow — its unit tests existed only as local runs, and
    # the AGP-9 KMP library modules shipping Res accessors with no backing
    # .cvr assets (fixed by androidResources { enable = true } in every shared
    # module) had no automated check because no gate ever opened the built
    # APK. The
    # :app:verifyPhoneStoreDebugComposeResources task closes that: it derives
    # the resource-carrying shared modules and their locale sets from the
    # source tree at execution time and asserts every assets/composeResources/
    # <packageOfResClass>/ prefix carries a .cvr entry per locale in the
    # built phoneStoreDebug APK (baseline: 216 = 24 modules x 9 locales).
    # No explicit Android SDK setup is needed: hosted ubuntu runners ship the
    # SDK (same reliance as release.yml and codeql.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        # submodules: recursive — uniform with shared-targets above; the
        # hostTest lanes must be free to open the plugin tree the same way
        # the datastore golden-file test does.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17 + 21
        # Same split as shared-targets: 17 = build toolchain/JAVA_HOME,
        # 21 = daemon JVM criteria (GRADLE_OPTS at the workflow level).
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            21
            17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Same fork-safe policy as shared-targets above.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: App unit tests + compose-resources guard
        # Run in CI, not just as local gate runs (baseline:
        # 94 phone / 98 tv tests).
        # :shared:core:{ui,data}:testAndroidHostTest are the cutover
        # homes of every legacy core module's Robolectric suites — the legacy
        # :core:ui/:core:data/:core:notification modules dissolved into the
        # shared tree's androidHostTest lanes (worker suites incl. the
        # OfflineWatchSyncContractTest regression pin; the drain-policy
        # bodies run portable in the core:data jvmTest lane above; the former
        # instrumented-only sheet/scrim pairs now execute under Robolectric).
        # Runner-sized heap/worker overrides (same medicine as the
        # shared-targets lane above): gradle.properties is tuned for an
        # 18-core dev box, and the stock 3g Kotlin daemon heap / 12 workers
        # GC-thrash OOMs on 4-core 16GB runners once this lane compiles the
        # full shared feature graph for both phone+tv unit-test variants
        # (compileAndroidMain died with "GC overhead limit exceeded" in four
        # feature modules before these were added).
        # :shared:feature:{player-video,syncplay}:testAndroidHostTest are the
        # feature-side hostTest lanes (Robolectric screen/surface suites) —
        # they compiled in no CI lane before this was added. (HostTest lanes
        # are NOT part of the derived shared-module scan above: which modules
        # own an androidHostTest source set is not derivable from
        # settings.gradle.kts.)
        # One invocation (was two): the compose-resources guard
        # (verifyPhoneStoreDebugComposeResources) dependsOn
        # assemblePhoneStoreDebug, so a single call overlaps its packaging
        # with the test compiles and saves a full configuration phase. The
        # full R8 fdroid RELEASE smoke build lives in the fdroid-smoke job
        # below (deferred off PRs).
        run: ./gradlew :app:testPhoneStoreDebugUnitTest :app:testTvStoreDebugUnitTest :shared:core:data:testAndroidHostTest :shared:core:ui:testAndroidHostTest :shared:feature:player-video:testAndroidHostTest :shared:feature:syncplay:testAndroidHostTest :app:verifyPhoneStoreDebugComposeResources --stacktrace --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" "-Pkotlin.daemon.jvmargs=-Xmx5g -XX:+UseParallelGC"

  fdroid-smoke:
    # Deferred off PRs: the full R8 minify + resource-shrink RELEASE build
    # of the fdroid flavor is a push/dispatch gate, not a per-PR gate (it
    # adds ~10 min of packaging that PR iteration doesn't need). A separate
    # job rather than a gated step: on push it runs IN PARALLEL with
    # android-app instead of serially appending to it, and on PRs the whole
    # job is skipped (no runner allocated). Runs on push to main/master/
    # kmp-alpha (incl. direct merges that never open a PR — the reason the
    # kmp-alpha branch exists on this trigger) + workflow_dispatch; skipped
    # on pull_request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up JDK 17 + 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            21
            17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: F-Droid flavor smoke build (GMS-free assertions)
        # Assembles the fdroid distribution flavor for the phone (exactly one
        # arm64-v8a APK, no universal) and runs tools/fdroid/verify-apk.sh
        # against it (see tools/fdroid/README.md for the policy each check
        # protects). The release-grade parity lane (buildserver env mirror +
        # signed reference binaries) is fdroid-release.yml; this job only
        # keeps the flavor+abiFilter build path green and the verify script
        # tracking the shipped artifact format.
        run: |
          ./gradlew :app:assemblePhoneFdroidRelease -PabiFilter=arm64-v8a --stacktrace --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" "-Pkotlin.daemon.jvmargs=-Xmx5g -XX:+UseParallelGC"
          code=$(grep -oP '(?<=^jellyplay\.versionCode=)\d+' version.properties)
          tools/fdroid/verify-apk.sh --expect-version-code $((code+1)) app/build/outputs/apk/phoneFdroid/release/*arm64-v8a*.apk

  desktop-package:
    #  release engineering: packaging dry-run per OS. Proves the
    # nativeDistributions config stays buildable and produces real installers:
    # :apps:desktop:packageDistributionForCurrentOS picks the targetFormats
    # valid for the runner (ubuntu → deb+rpm, windows → msi with the CMP
    # plugin's auto-downloaded WiX toolset, macos → dmg). Runs standalone —
    # it depends only on the repo checkout, nothing fragile.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout Repository
        # submodules: recursive — packaging embeds the shared tree; keep the
        # plugin tree present so any future packaging-time read of it (the
        # companion plugin artifact lives there) can't break the lane.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17 + 21
        # Same split as shared-targets: 17 = build toolchain/JAVA_HOME,
        # 21 = daemon JVM criteria (GRADLE_OPTS at the workflow level) —
        # windows packaging died at daemon start on the foojay 400 otherwise.
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            21
            17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Same fork-safe policy as shared-targets above.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Package desktop installers for current OS
        # -PjellyplayVersion mirrors the release-lane contract documented in
        # apps/desktop/build.gradle.kts (numeric x.y.z only; jpackage/msi
        # constraint).
        # Runner-sized heap/worker overrides (same medicine as the
        # shared-targets lane): the stock gradle.properties Kotlin daemon heap
        # GC-thrash OOM'd the windows runner mid compileKotlinJvm
        # (:shared:feature:settings) while ubuntu/macos passed on margin —
        # same latent risk on all three.
        run: ./gradlew :apps:desktop:packageDistributionForCurrentOS -PjellyplayVersion=0.1.0 --stacktrace --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" "-Pkotlin.daemon.jvmargs=-Xmx5g -XX:+UseParallelGC"

      - name: Dump jpackage logs on failure
        # Compose's ExternalToolRunner only NAMES the runner-local *-out/-err
        # files on jpackage failure — without this the actual cause never
        # reaches the Actions log (macos createDistributable exit 1 had zero
        # stderr in-log).
        if: failure()
        run: |
          shopt -s nullglob
          for f in apps/desktop/build/compose/logs/**/*.txt apps/desktop/build/compose/logs/*/*.txt; do
            echo "===== $f ====="
            cat "$f"
          done

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-${{ matrix.os }}
          # Default (non-proguard) build type lands under main/ —
          # packageReleaseDistributionForCurrentOS would use main-release/.
          path: apps/desktop/build/compose/binaries/main/*
          retention-days: 7
          if-no-files-found: error
