name: KMP Build

# Shared-tree (KMP) verification: docs/kmp-migration-plan.md Phase 0.
# Compiles every configured target of the shared/ tree on all three desktop
# OSes and runs its common tests. Android app lanes are unaffected.

on:
  push:
    branches: ['main', 'master']
  pull_request:
  workflow_dispatch:

concurrency:
  group: kmp-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-targets:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Build shared targets (JVM + wasm + Android)
        # The AGP KMP library plugin exposes no per-variant assembleDebug;
        # android target verifies via its single androidMain compilation.
        # wasmJs target exists on model/datastore/designsystem/network/
        # player-contract plus the apps:web shell (§Phase W) — database and
        # data ship without it (no Room on wasm v1, plan §Phase W).
        # player-contract gained wasm in W.3 when MediaEngine's supertypes
        # (PlayerLifecycleCallbacks, RemotePlayableEngine) moved into it from
        # shared core:data in the same packages.
        run: >
          ./gradlew
          :shared:core:model:jvmJar
          :shared:core:model:compileKotlinWasmJs
          :shared:core:model:compileAndroidMain
          :shared:core:designsystem:jvmJar
          :shared:core:designsystem:compileKotlinWasmJs
          :shared:core:designsystem:compileAndroidMain
          :shared:core:datastore:jvmJar
          :shared:core:datastore:compileKotlinWasmJs
          :shared:core:datastore:compileAndroidMain
          :shared:core:database:jvmJar
          :shared:core:database:compileAndroidMain
          :shared:core:network:jvmJar
          :shared:core:network:compileKotlinWasmJs
          :shared:core:network:compileAndroidMain
          :shared:core:data:jvmJar
          :shared:core:data:compileAndroidMain
          :shared:core:ui:jvmJar
          :shared:core:ui:compileAndroidMain
          :shared:core:player-contract:jvmJar
          :shared:core:player-contract:compileKotlinWasmJs
          :shared:core:player-contract:compileAndroidMain
          :shared:feature:search:jvmJar
          :shared:feature:search:compileAndroidMain
          :shared:feature:library:jvmJar
          :shared:feature:library:compileAndroidMain
          :shared:feature:music:jvmJar
          :shared:feature:music:compileAndroidMain
          :shared:feature:livetv:jvmJar
          :shared:feature:livetv:compileAndroidMain
          :shared:feature:downloads:jvmJar
          :shared:feature:downloads:compileAndroidMain
          :shared:feature:syncplay:jvmJar
          :shared:feature:syncplay:compileAndroidMain
          :shared:feature:settings:jvmJar
          :shared:feature:settings:compileAndroidMain
          :shared:feature:admin:jvmJar
          :shared:feature:admin:compileAndroidMain


          :shared:feature:editor:jvmJar
          :shared:feature:editor:compileAndroidMain

          :shared:feature:calendar:jvmJar
          :shared:feature:calendar:compileAndroidMain


          :shared:feature:requests:jvmJar
          :shared:feature:requests:compileAndroidMain



          :shared:feature:shortcuts:jvmJar
          :shared:feature:shortcuts:compileAndroidMain

          :shared:feature:newsletter:jvmJar
          :shared:feature:newsletter:compileAndroidMain


          :shared:feature:insights:jvmJar
          :shared:feature:insights:compileAndroidMain
          :shared:feature:onboarding:jvmJar
          :shared:feature:onboarding:compileAndroidMain
          :shared:feature:subtitle-tester:jvmJar
          :shared:feature:subtitle-tester:compileAndroidMain

          :shared:feature:arrqueue:jvmJar
          :shared:feature:arrqueue:compileAndroidMain

          :shared:feature:auth:jvmJar
          :shared:feature:auth:compileAndroidMain
          :shared:feature:details:jvmJar
          :shared:feature:details:compileAndroidMain
          :shared:feature:home:jvmJar
          :shared:feature:home:compileAndroidMain

          :apps:web:compileKotlinWasmJs

          --stacktrace

      - name: Shared tests (JVM)
        run: >
          ./gradlew
          :shared:core:model:jvmTest
          :shared:core:datastore:jvmTest
          :shared:core:database:jvmTest
          :shared:core:network:jvmTest
          :shared:core:data:jvmTest
          :shared:core:ui:jvmTest
          :shared:core:player-contract:jvmTest
          :shared:feature:search:jvmTest
          :shared:feature:library:jvmTest
          :shared:feature:music:jvmTest
          :shared:feature:livetv:jvmTest
          :shared:feature:downloads:jvmTest
          :shared:feature:syncplay:jvmTest
          :shared:feature:settings:jvmTest
          :shared:feature:admin:jvmTest


          :shared:feature:editor:jvmTest

          :shared:feature:calendar:jvmTest


          :shared:feature:requests:jvmTest



          :shared:feature:shortcuts:jvmTest

          :shared:feature:newsletter:jvmTest


          :shared:feature:insights:jvmTest
          :shared:feature:onboarding:jvmTest
          :shared:feature:subtitle-tester:jvmTest

          :shared:feature:arrqueue:jvmTest
          :shared:feature:details:jvmTest

          :shared:feature:auth:jvmTest
          :shared:feature:home:jvmTest


          --stacktrace

      - name: Shell tests (Koin registration guard)
        # :apps:desktop:test hosts the Koin-registration ratchet
        # (KoinModuleRegistrationGuardTest) — startKoin wiring is runtime-only
        # and invisible to every compile gate (arrqueue/shortcuts lessons,
        # plan §Phase X), so it must run in CI, not just locally.
        run: ./gradlew :apps:desktop:test --stacktrace
