# Shared runner prereqs for the lanes that build the signed release app and
# boot a Gradle Managed Device emulator (release, baseline-profile
# generation, startup benchmark): decode the release keystore, grant the
# gradlew exec bit, and enable KVM access. ONE home — the three lanes used
# to hand-copy this triple.
name: 'Setup GMD runner'
description: 'Decode release keystore, chmod gradlew, enable /dev/kvm for the GMD emulator'
inputs:
  keystore-base64:
    description: 'Base64-encoded release keystore (pass secrets.KEYSTORE_BASE64)'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Decode Keystore
      shell: bash
      run: echo "${{ inputs.keystore-base64 }}" | base64 -d > jellyplay-release.jks

    - name: Grant Execute Permission for Gradlew
      shell: bash
      run: chmod +x ./gradlew

    # GMD emulator needs writable /dev/kvm. ubuntu runners expose it, but not
    # always world/group-accessible for the runner user — apply the same udev
    # rule android-emulator-runner uses, then fail fast with a clear message
    # if the runner genuinely lacks nested virtualization.
    - name: Enable KVM access
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm || { echo "::error::/dev/kvm missing — runner has no nested virtualization, emulator cannot start"; exit 1; }
        /usr/local/lib/android/sdk/emulator/emulator -accel-check || true
