# Canonical JellyPlay Android version. Read by app/build.gradle.kts at
# configuration time; a `-PversionName=` / `-PversionCode=` property
# (CI passes github.run_number) overrides either value, so CI versionCodes
# keep their own space. See the version-resolution block in
# app/build.gradle.kts for the scheme: versionCode =
# major*100_000 + minor*1_000 + patch*10 (+ abiIndex under -PabiFilter).
jellyplay.versionName=0.11.11
jellyplay.versionCode=11110
