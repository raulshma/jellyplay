[versions]
agp = "9.3.1"
kotlin = "2.3.21"
ksp = "2.3.10"
kover = "0.9.9"
composeBom = "2026.06.01"
composeMaterial3 = "1.5.0-alpha25"
composeMaterial3Adaptive = "1.3.0-rc01"
# material3-adaptive-navigation-suite lives in the androidx.compose.material3
# group (NOT .adaptive) and tracks the material3 release line, not the adaptive
# one. Previously keyed off composeMaterial3Adaptive — only worked by accident.
composeMaterial3AdaptiveNavigationSuite = "1.5.0-alpha25"
# JetBrains Compose Multiplatform distribution — the ONLY publisher of real
# JVM/wasm compose binaries (androidx publishes Android AARs + IDE stubs only,
# verified via .module metadata of ui 1.12.0 / material3 1.5.0-alpha25). On the
# Android target these redirect to the androidx artifacts.
composeMultiplatform = "1.11.1"
# JB material3 rides its own train; the 1.11.x line never stabilised past
# alpha (latest release overall is 1.9.0), so pin the newest of the matching
# 1.11 line to keep expressive APIs available on desktop/wasm.
composeMultiplatformMaterial3 = "1.11.0-alpha07"
# Koin: shared-module DI (plan §Phase C4). 4.2.x publishes android/jvm/wasmJs
# (wasmJs stable since 4.0.0). Hand-written DSL modules — koin-annotations
# deferred until its KSP line settles (kspWasmJs unverified).
koin = "4.2.2"
# Plain dagger artifact only — shared/core/network's JellyfinApiEngine ctor
# takes dagger.Lazy (fed by a memoizing wrapper in NetworkKoinModules). All
# Hilt artifacts left the repo with the wave-8 Hilt extinction.
dagger = "2.60.1"
navigation3 = "1.1.5"
# JetBrains fork of navigation3-ui: google's -ui artifact ships Android plus
# jvm/linux STUBS only (runtime throws "Implemented only in JetBrains fork");
# the fork holds the real desktop/web NavDisplay. Runtime stays on the google
# artifact — the fork's POM depends on it too, so only -ui needs swapping.
jbNavigation3Ui = "1.1.1"
lifecycleViewmodelNav3 = "2.11.0"
jellyfinSdk = "1.8.12"
media3 = "1.10.1"
media3FfmpegDecoder = "1.9.0+1"
androidDesugarJdkLibs = "2.1.5"
# Coil pinned BELOW latest deliberately: 3.4.0 is the last line whose KMP
# artifacts were built with a Kotlin 2.3 compiler (Central's
# coil-core-3.4.0-kotlin-tooling-metadata.json reports buildPluginVersion
# 2.3.10), so its wasmJs klibs load under this repo's 2.3.21 toolchain.
# 3.5.0 rebuilt them with Kotlin 2.4.0; those klibs are silently SKIPPED by
# the 2.3.21 klib loader and every coil3 symbol stays unresolved under
# :apps:web:compileKotlinWasmJs (JVM/Android class files are unaffected by
# either side — the pin is only about the wasm target). Revisit on any
# future Kotlin 2.4 toolchain move.
coil = "3.4.0"
# 0.41.0 (wave 21D): the last mikepenz line whose wasm klibs are built with
# Kotlin 2.3.x — 0.42+ rebuilt them with Kotlin 2.4.0, and those klibs are
# silently SKIPPED by the 2.3.21 klib loader (spike w-10C class C), which is
# why wasm used to carry a MiniMarkdownParser fallback while the dependency
# stayed jvmShared-scoped. At 0.41.0 the klibs resolve on wasm too, so the
# dependency lives in commonMain and every target renders GFM through the
# same MarkdownBody (the mini parser + wasm actual were deleted). Revisit on
# any future Kotlin 2.4 toolchain move.
multiplatformMarkdownRenderer = "0.41.0"
room = "2.8.4"
datastore = "1.2.1"
okio = "3.9.0"
javakeyring = "1.0.4"
androidxSqlite = "2.6.2"
paging = "3.5.0"
pagingCompose = "3.5.0"
workManager = "2.11.2"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
# kotlinx-datetime 0.8.0 is the newest release line and is ABI-safe for this
# repo's Kotlin 2.3.21 pin: its Gradle module metadata (fetched 2026-08-27,
# wave 15B) declares kotlin-stdlib 2.1.20 on the metadataApiElements variant —
# i.e. the klibs were produced by the Kotlin 2.1.20 compiler, which our 2.3.21
# klib loader reads (a 2.4-built klib would be silently skipped — the coil
# 3.4.0/mikepenz precedent). The wasm klib artifact
# (org.jetbrains.kotlinx:kotlinx-datetime-wasm-js:0.8.0.klib) exists on Maven
# Central. Its transitive kotlinx-serialization-core 1.6.2 want upgrades to the
# repo-wide 1.11.0 pin — no new serialization version enters the graph.
kotlinxDatetime = "0.8.0"
# Browser DOM bindings for the wasmJs target (Kotlin/Wasm interop).
kotlinxBrowser = "0.5.0"
palette = "1.0.0"
coreKtx = "1.19.0"
collection = "1.6.0"
activityCompose = "1.13.0"
coreSplashScreen = "1.2.0"
lifecycle = "2.11.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
mockk = "1.14.11"
orgJson = "20240303"
coroutinesTest = "1.11.0"
robolectric = "4.16.1"
androidxTestCore = "1.7.0"
uiautomator = "2.4.0"
playServicesCast = "22.3.1"
mediarouter = "1.9.0-alpha01"
slf4j = "2.0.18"
libmpv = "0.1.12"
# JNA for the desktop libmpv binding (Phase V2 MpvDesktopEngine)
jna = "5.17.0"
libvlc = "3.7.5"
assMedia = "0.5.0"
truetypeParser = "2.1.4"
okhttp = "5.4.0"
# Ktor: wasmJs HTTP/WebSocket client (plan §Phase W). Desktop/Android keep
# OkHttp; Ktor exists for the wasm target of shared/core/network + apps/web.
ktor = "3.5.2"
tvMaterial = "1.1.0"
tablerIcons = "2.2.1"
biometric = "1.4.0-alpha07"
# androidx.biometric: still pre-release-only beyond 1.1.0; 1.4.0-alpha07 is latest.
# androidx.security:security-crypto graduated to 1.1.0 stable (2025).
# Used only by SeerrSecureCredentialsStore (AES256-GCM + AES256-SIV via Keystore-backed MasterKey).
security = "1.1.0"
benchmarkMacro = "1.5.0-alpha07"
# androidx.benchmark 1.5.x alphas: required for the Baseline Profile Gradle plugin
# to be compatible with AGP 9.x (fixes b/443311090 in 1.5.0-alpha01). The plugin
# and benchmark-macro-junit4 share the androidx.benchmark release train, so the
# same version.ref is used for both.
baselineprofile = "1.5.0-alpha07"
aboutLibraries = "15.0.4"

[libraries]
# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashScreen" }
androidx-collection = { group = "androidx.collection", name = "collection", version.ref = "collection" }
androidx-collection-ktx = { group = "androidx.collection", name = "collection-ktx", version.ref = "collection" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# Compose BOM
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
jb-compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
jb-compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
# Desktop-only compose ui surface (SwingPanel & friends) for shared modules'
# jvmMain actuals (wave 9A player-video surface host). Same version family
# as the jb-compose-* set; runtime resolves via apps/desktop currentOs.
jb-compose-ui-desktop = { group = "org.jetbrains.compose.ui", name = "ui-desktop", version.ref = "composeMultiplatform" }
jb-compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
jb-compose-animation = { group = "org.jetbrains.compose.animation", name = "animation", version.ref = "composeMultiplatform" }
jb-compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMultiplatformMaterial3" }
jb-compose-saveable = { group = "org.jetbrains.compose.runtime", name = "runtime-saveable", version.ref = "composeMultiplatform" }
# Compose-Resources runtime (StringResource/getString). Shared KMP modules get
# it via `compose.components.resources`; this alias is for legacy AGP modules
# whose tests name the type against shared/core:ui's public Res accessors.
jb-compose-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "composeMultiplatform" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-test = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "composeMaterial3" }
compose-ui-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts" }
tabler-icons-outline = { group = "com.composables", name = "icons-tabler-outline-cmp", version.ref = "tablerIcons" }
tabler-icons-filled = { group = "com.composables", name = "icons-tabler-filled-cmp", version.ref = "tablerIcons" }
compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "composeMaterial3Adaptive" }
compose-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout", version.ref = "composeMaterial3Adaptive" }
compose-material3-adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "composeMaterial3Adaptive" }
compose-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "composeMaterial3AdaptiveNavigationSuite" }

# Navigation 3
navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
# Desktop swap target for navigation3-ui (see jbNavigation3Ui version note) —
# used via resolutionStrategy substitution in apps/desktop, never a direct dep.
jb-navigation3-ui = { group = "org.jetbrains.androidx.navigation3", name = "navigation3-ui", version.ref = "jbNavigation3Ui" }
lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }

# Lifecycle
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
# SavedStateHandle (KMP since lifecycle 2.9) — StudioDetailViewModel in shared/feature:library
lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }

# Koin (shared/core/* commonMain+jvmShared module defs; koin-test for jvmTest verify())
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin" }
# KMP viewModel scoping for shared feature modules (koinViewModel() in nav entries)
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koin" }

# javax.inject (Hilt constructor-injection annotations, usable from non-Hilt modules)
javax-inject = { group = "javax.inject", name = "javax.inject", version = "1" }

# Plain dagger artifact: dagger.Lazy ctor params on shared-module classes
# (JellyfinApiEngine) need the type on the KMP compile classpath without
# pulling an Android-only AAR into the jvm target.
dagger = { group = "com.google.dagger", name = "dagger", version.ref = "dagger" }

# Jellyfin SDK
jellyfin-core = { group = "org.jellyfin.sdk", name = "jellyfin-core", version.ref = "jellyfinSdk" }

# Media3 / ExoPlayer
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
media3-extractor = { group = "androidx.media3", name = "media3-extractor", version.ref = "media3" }
media3-cast = { group = "androidx.media3", name = "media3-cast", version.ref = "media3" }
media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
media3-database = { group = "androidx.media3", name = "media3-database", version.ref = "media3" }
# Prebuilt FFmpeg audio decoder (native .so included) for codecs MediaCodec
# lacks on most devices (DTS, MLP, TrueHD, etc.). Auto-loaded by
# DefaultRenderersFactory via reflection when EXTENSION_RENDERER_MODE is ON.
media3-ffmpeg-decoder = { group = "org.jellyfin.media3", name = "media3-ffmpeg-decoder", version.ref = "media3FfmpegDecoder" }

# Core library desugaring (required by media3-ffmpeg-decoder)
android-desugar-jdk = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "androidDesugarJdkLibs" }

# Coil
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
# Ktor-backed network fetcher for wasmJs (apps/web; Phase W.4). NOTE: the
# artifact is named coil-network-ktor3 — upstream split the old
# coil-network-ktor (last published 3.0.0-alpha08) into -ktor2/-ktor3
# flavors by Ktor major before 3.0.0 stable. Same coil version pin; the
# ktor3 flavor matches our Ktor 3.5.x stack (its own metadata declares
# ktor-client-core 3.1.0; Gradle resolves to the repo-wide 3.5.2). Wired
# into :apps:web's wasmJsMain image pipeline — the only consumer — since
# the 3.4.0 pin made its wasmJs klib loadable again (see the version note
# above).
coil-network-ktor3 = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil" }

# Markdown renderer (GitHub-flavoured; used for release notes & plugin changelogs)
multiplatform-markdown-renderer = { group = "com.mikepenz", name = "multiplatform-markdown-renderer", version.ref = "multiplatformMarkdownRenderer" }
multiplatform-markdown-renderer-m3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "multiplatformMarkdownRenderer" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
java-keyring = { group = "com.github.javakeyring", name = "java-keyring", version.ref = "javakeyring" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "androidxSqlite" }

# Paging
paging-common = { group = "androidx.paging", name = "paging-common", version.ref = "paging" }
paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "pagingCompose" }

# WorkManager
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
work-testing = { group = "androidx.work", name = "work-testing", version.ref = "workManager" }

# Palette
palette-ktx = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }

# Kotlinx Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-browser = { group = "org.jetbrains.kotlinx", name = "kotlinx-browser", version.ref = "kotlinxBrowser" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

# Google Cast
play-services-cast-framework = { group = "com.google.android.gms", name = "play-services-cast-framework", version.ref = "playServicesCast" }
mediarouter = { group = "androidx.mediarouter", name = "mediarouter", version.ref = "mediarouter" }

# SLF4J
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }

# Player Engines
libmpv = { group = "io.github.abdallahmehiz", name = "mpv-android-lib", version.ref = "libmpv" }
# Desktop libmpv access (mpv-2.dll / libmpv.so / libmpv.dylib) for MpvDesktopEngine
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
libvlc-all = { group = "org.videolan.android", name = "libvlc-all", version.ref = "libvlc" }
# libass wired into Media3's renderer pipeline — full ASS/SSA rendering
# (positioning, fonts, animations, karaoke, vector drawing) on the
# ExoPlayer backend. Bundles its own libass native .so per ABI.
ass-media = { group = "io.github.peerless2012", name = "ass-media", version.ref = "assMedia" }
# Pure-Kotlin ASS subtitle parser/renderer core. Brings AssRender into the
# compile classpath so ExoPlayerEngine can call setFontScale for SCALE override
# on ASS tracks (same release train as ass-media, reusing the assMedia version).
ass-kt = { group = "io.github.peerless2012", name = "ass-kt", version.ref = "assMedia" }
# Parse font family names from .ttf/.otf headers for the subtitle font picker.
truetype-parser = { group = "io.github.yubyf", name = "truetypeparser-light", version.ref = "truetypeParser" }

# OkHttp
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

# Ktor (wasmJs transport, Phase W) — engine for wasmJs comes from ktor-client-js
# (ships js+wasmJs variants); desktop/Android HTTP stays on OkHttp.
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-js = { group = "io.ktor", name = "ktor-client-js", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-websockets = { group = "io.ktor", name = "ktor-client-websockets", version.ref = "ktor" }

# Android TV
tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }
tvprovider = { group = "androidx.tvprovider", name = "tvprovider", version = "1.1.0" }

# Biometric
biometric-ktx = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# Security (encrypted prefs)
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security" }

benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmarkMacro" }

# AboutLibraries (auto-collected open-source license metadata at build time)
aboutlibraries-core = { group = "com.mikepenz", name = "aboutlibraries-core", version.ref = "aboutLibraries" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
# Baseline Profile Gradle plugin (androidx.benchmark 1.5.x — AGP 9 compatible).
# - `androidx.baselineprofile`          → applied by the app/consumer module.
# - `androidx.baselineprofile.producer` → applied by the com.android.test module
#                                         that runs the macrobenchmark generator.
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
androidx-baselineprofile-producer = { id = "androidx.baselineprofile.producer", version.ref = "baselineprofile" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# CMP distribution plugin: required for compose-resources config (`compose.resources {}`).
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Kotlin Multiplatform (docs/kmp-migration-plan.md §Phase 0): the shared/ tree.
# AGP 9 forbids combining org.jetbrains.kotlin.multiplatform with
# com.android.library, so every KMP module's Android target uses AGP's
# dedicated KMP library plugin below instead.
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
