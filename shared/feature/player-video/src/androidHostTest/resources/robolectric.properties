# Robolectric 4.16 emulates at most SDK 36, but this module's merged manifest
# targets SDK 37 (AGP 9 defaults an unset targetSdk to compileSdk) — serving
# the real manifest via isIncludeAndroidResources then fails configuration.
# Pin the whole module; same convention as shared/core/ui's
# robolectric.properties.
#
# qualifiers: Robolectric's default 320x480dp phone clips the full-screen
# player overlays (300dp-wide cards, bottom-bar chrome) so their text lands
# outside the visible bounds and assertIsDisplayed fails. The player UI is
# laid out for phone-landscape/TV sizes — a 1080p-ish density-independent
# screen mirrors the device lane the suites were written against.
sdk=35
qualifiers=w1920dp-h1080dp
