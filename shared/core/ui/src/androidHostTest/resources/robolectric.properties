# Robolectric 4.16 emulates at most SDK 36, but this module's merged manifest
# targets SDK 37 (AGP 9 defaults an unset targetSdk to compileSdk) — serving
# the real manifest via isIncludeAndroidResources then fails configuration.
# Pin the whole module; same convention as feature/player/video's
# robolectric.properties and core/data's @Config(sdk = [35]).
#
# qualifiers: Robolectric's default 320x480dp screen under-serves the
# min-constraint styles (72dp PIN keys — ComponentStyles.pinKeyStyle) so
# PinLockScreen's measure crashes; a modern-phone canvas mirrors the device
# lane the suites were written against.
sdk=35
qualifiers=w411dp-h891dp
