# Static server config for the wasmJs production bundle (see Dockerfile).
#
# Cache posture: `webapp.js` carries NO content hash (the name is pinned in
# apps/web/build.gradle.kts), so long-lived immutable caching would serve
# stale shells across releases; the .wasm assets ARE hashed by webpack, but
# a single policy keeps the headers honest — etag + `no-cache` everywhere,
# meaning one revalidation per asset per load (304, body re-fetched only on
# change). The safe ceiling until the JS gets hashed names too.
#
# `application/wasm` must survive MIME mapping intact: the engine boot path
# uses WebAssembly.instantiateStreaming, which hard-rejects wrong types.
# nginx ships the mapping since 1.21.1; gzip_types adds the wasm binary so
# the multi-MB module still travels compressed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/wasm
        image/svg+xml
        text/css;

    # Routing is hash-based (WebAppRoot reads window.location.hash), so no
    # SPA rewrite is needed — unknown paths are genuinely missing files.
    location / {
        try_files $uri $uri/ =404;
        etag on;
        add_header Cache-Control "no-cache";
    }
}
